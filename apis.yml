aid: foaster
name: Foaster
description: Foaster is an AI transformation consultancy that bills itself as "the AI-native
  McKinsey." Founded in 2026 by Raphael Dabadie and Alexandre Combes and backed by Y Combinator,
  it deploys AI agents that interview a company's employees at scale, map how work actually gets
  done, identify bottlenecks and AI opportunities, and draft a transformation roadmap in about two
  weeks, with expert consultants reviewing the outputs and feeding their corrections back into the
  system. Its offerings span an AI Transformation Assessment, Continuous AI Transformation with
  monthly adoption tracking, and Enterprise Deployment backed by forward-deployed engineers. Foaster
  is a managed professional-services company and does not currently publish a public API, developer
  portal, SDKs, or other developer-facing technical surface.
